name: buvoza_v1
description: MVP local de BuVoza para registrar informes del conductor mediante dictado por voz y PDF.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.3.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  share_plus: ^10.1.4
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
